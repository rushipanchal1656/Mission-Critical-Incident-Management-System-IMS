# Docker Compose configuration for local development of the Incident Management System (IMS)
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ims
      REDIS_HOST: redis
      QUEUE_NAME: incident_queue
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ims
      REDIS_HOST: redis
      QUEUE_NAME: incident_queue
    depends_on:
      - db
      - redis

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: ims
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine