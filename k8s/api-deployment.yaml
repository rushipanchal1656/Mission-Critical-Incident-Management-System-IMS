apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: rushipanchal/api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: SQS_QUEUE_URL
              value: "https://sqs.ap-south-1.amazonaws.com/399122937371/ims-queue"
            - name: DB_HOST
              value: "postgres"
            - name: DB_USER
              value: "admin"
            - name: DB_PASSWORD
              value: "admin"
            - name: DB_NAME
              value: "ims"
            - name: AWS_DEFAULT_REGION
              value: "ap-south-1"

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 20
