apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: rushipanchal/worker:v1
          imagePullPolicy: Always
          env:
            - name: SQS_QUEUE_URL
              value: "https://sqs.ap-south-1.amazonaws.com/399122937371/ims-queue"
            - name: AWS_DEFAULT_REGION
              value: "ap-south-1"
            - name: DB_HOST
              value: "postgres"
            - name: DB_USER
              value: "admin"
            - name: DB_PASSWORD
              value: "admin"
            - name: DB_NAME
              value: "ims"